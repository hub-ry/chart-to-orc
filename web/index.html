<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chart-to-orc</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>chart-to-orc</h1>
  <span id="health" class="muted"></span>
</header>
<main>
  <section class="card">
    <h2>1 · draw</h2>
    <input type="file" id="drawing" accept="image/*">
    <img id="preview" hidden alt="drawing preview">
    <button id="compile-drawing" disabled>compile drawing</button>
    <details>
      <summary>no vision? paste a JSON spec instead</summary>
      <textarea id="spec" rows="12" spellcheck="false" placeholder='{"name":"…","agents":[…],"channels":[…]}'></textarea>
      <button id="compile-spec">compile spec</button>
    </details>
    <p id="msg" class="muted"></p>
  </section>
  <section class="card" id="result" hidden>
    <h2>2 · compiled graph</h2>
    <div id="graph"></div>
  </section>
  <section class="card">
    <h2>graphs</h2>
    <ul id="graphs"></ul>
  </section>
  <section class="card" id="agent-panel" hidden>
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close">close</button>
    </div>
    <p id="panel-error" class="error" hidden></p>
    <div class="md-view" id="md-view"></div>
    <div class="prompt-box">
      <textarea id="prompt" rows="3" spellcheck="false" placeholder="prompt this agent…"></textarea>
      <button id="send-prompt" class="primary">send</button>
    </div>
    <div class="traffic">
      <h3>traffic</h3>
      <ul id="traffic"></ul>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
